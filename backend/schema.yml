components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    Actualizadas:
      type: object
      properties:
        actualizadas:
          type: integer
      required:
      - actualizadas
    Auditoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
        usuario:
          type: string
          format: email
          readOnly: true
        accion:
          allOf:
          - $ref: '#/components/schemas/AuditoriaAccionEnum'
          readOnly: true
        modelo:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        representacion:
          type: string
          readOnly: true
        cambios:
          readOnly: true
      required:
      - accion
      - cambios
      - fecha
      - id
      - modelo
      - object_id
      - representacion
      - usuario
    AuditoriaAccionEnum:
      enum:
      - crear
      - modificar
      - borrar
      - suplantar
      type: string
      description: |-
        * `crear` - Crear
        * `modificar` - Modificar
        * `borrar` - Borrar
        * `suplantar` - Suplantar
    CambiarPasswordRequest:
      type: object
      properties:
        actual:
          type: string
          writeOnly: true
          minLength: 1
        nueva:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - actual
      - nueva
    Categoria:
      type: object
      description: 'Limita los campos relacionados al hogar de la URL: no se puede
        apuntar a datos de otro hogar (módulo 33).'
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 60
        padre:
          type: integer
          nullable: true
        color:
          type: string
          maxLength: 7
        icono:
          type: string
          maxLength: 40
        orden:
          type: integer
          maximum: 32767
          minimum: 0
        es_ingreso:
          type: boolean
          title: Es de ingresos
      required:
      - id
      - nombre
    CategoriaDashboard:
      type: object
      properties:
        categoria:
          type: integer
          nullable: true
        nombre:
          type: string
        color:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        porcentaje:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
      required:
      - categoria
      - color
      - nombre
      - porcentaje
      - total
    CategoriaRequest:
      type: object
      description: 'Limita los campos relacionados al hogar de la URL: no se puede
        apuntar a datos de otro hogar (módulo 33).'
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
        padre:
          type: integer
          nullable: true
        color:
          type: string
          minLength: 1
          maxLength: 7
        icono:
          type: string
          maxLength: 40
        orden:
          type: integer
          maximum: 32767
          minimum: 0
        es_ingreso:
          type: boolean
          title: Es de ingresos
      required:
      - nombre
    Cola:
      type: object
      properties:
        nombre:
          type: string
        workers:
          type: integer
          description: Workers que consumen de esta cola
        pendientes:
          type: integer
          nullable: true
          description: 'Mensajes esperando (null: desconocido)'
      required:
      - nombre
      - pendientes
      - workers
    Comercio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 120
      required:
      - id
      - nombre
    ComercioDashboard:
      type: object
      properties:
        comercio:
          type: integer
        nombre:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        veces:
          type: integer
      required:
      - comercio
      - nombre
      - total
      - veces
    ComercioRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - nombre
    ComercioSoporte:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        nombre_normalizado:
          type: string
          readOnly: true
        nif:
          type: string
          readOnly: true
        categoria_sugerida:
          type: string
          readOnly: true
          title: Categoría sugerida
        num_movimientos:
          type: integer
          readOnly: true
      required:
      - categoria_sugerida
      - id
      - nif
      - nombre
