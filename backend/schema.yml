  /api/v1/backoffice/auditoria/:
    get:
      operationId: backoffice_auditoria_list
      description: 'Solo lectura, también para el superusuario: una auditoría que
        se puede editar no sirve.'
      parameters:
      - in: query
        name: accion
        schema:
          type: string
          enum:
          - borrar
          - crear
          - modificar
          - suplantar
        description: |-
          * `crear` - Crear
          * `modificar` - Modificar
          * `borrar` - Borrar
          * `suplantar` - Suplantar
      - in: query
        name: modelo
        schema:
          type: string
        description: app.modelo, p. ej. finanzas.movimiento
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - backoffice
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditoriaList'
          description: ''
