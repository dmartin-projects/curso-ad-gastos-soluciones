@if (sinArchivo()) {
  <p class="mt-8 text-center text-texto-suave">
    No ha llegado ningún archivo. Compártelo de nuevo desde la galería.
  </p>
} @else if (elegir()) {
  <h1 class="mb-4 text-2xl font-medium">¿A qué hogar subes el ticket?</h1>
  <div class="grid gap-3 sm:grid-cols-2">
    @for (h of store.hogares(); track h.id) {
      <button mat-stroked-button class="!h-auto !p-4" (click)="ir(h.id)">{{ h.nombre }}</button>
    }
  </div>
}
